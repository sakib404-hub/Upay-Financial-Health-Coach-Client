<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006948" />
      <stop offset="50%" stop-color="#005238" />
      <stop offset="100%" stop-color="#003825" />
    </linearGradient>

    <!-- Emerald Sheen Gradient -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#85f8c4" />
      <stop offset="50%" stop-color="#4edea3" />
      <stop offset="100%" stop-color="#00855d" />
    </linearGradient>

    <!-- Subtle Inner Shadow / Highlight -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#85f8c4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="2" />

  <!-- Ambient Light Reflection -->
  <circle cx="96" cy="32" r="36" fill="#85f8c4" fill-opacity="0.12" filter="blur(16px)" />

  <!-- Upay Stylized Growth Shield & Ascending Path -->
  <g filter="url(#glow)">
    <!-- Stylized 'U' with an ascending right arm -->
    <path
      d="M 38 42
         L 38 72
         C 38 88 50 94 64 94
         C 78 94 90 88 90 72
         L 90 42"
      fill="none"
      stroke="url(#emeraldGlow)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Upward Momentum Arrow / Growth Catalyst Peak -->
    <path
      d="M 64 66
         L 64 34
         M 52 46
         L 64 34
         L 76 46"
      fill="none"
      stroke="#ffffff"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Sparkle Diamond -->
    <polygon
      points="94,28 97,35 104,38 97,41 94,48 91,41 84,38 91,35"
      fill="#85f8c4"
    />
  </g>
</svg>
